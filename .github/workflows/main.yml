name: Build Java Application
on:
  workflow_dispatch:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
    - name: Clone the repo
      uses: actions/checkout@v6
    - name: Install java on runner
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Build java code
      run: mvn clean package
    - name: Setup Docker on the Runner
      uses: docker/setup-docker-action@v4
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        # Command we use on the terminal --> "docker build -t image_name .", but here we going to use the context
        context: . # location where dockerfile is and in our case the dockerfile is in the current directory of the repo
        push: true # when kept 'true', it pushes the image to the docker hub
        tags: rohandevops01/myjavaapp # tagging the image 
